# (VAE latent, Virchow2 CLS) pairs at 256 px: n_train random train tiles + 512 test tiles.
# 16,384,000 = 16,000 steps x batch 1024, so training sees each pair about once, as in the paper.
# n_train: -1 encodes every train tile (about 1.3 TB for full TCGA). A smaller train split is used whole.
# Run one process per GPU with --set shard=i num_shards=N, then --set merge=true.
store_dir: ${STORE_DIR}
tiles_dir: ${DATA_ROOT}/tiles
embeddings_dir: ${DATA_ROOT}/embeddings/virchow2
output_dir: ${PAIRS_DIR}
vae: stabilityai/sd-vae-ft-mse
resolution: 256
tile_px: 256
n_train: 16384000
n_test: 512
batch_size: 128
num_workers: 6
shard: 0
num_shards: 8
merge: false
device: cuda
seed: 0
